{% extends 'estoque/base.html' %}

{% block title %}Entrada de Validade{% endblock %}

{% block content %}

<h1 class="mb-4">Entrada de Validade</h1>

<div class="card card-indicador">
    <div class="card-body">

        <h4>{{ material.nome }}</h4>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Data de validade</label>
                <input type="date"
                       name="data_validade"
                       class="form-control"
                       value="{{ material.data_validade|date:'Y-m-d' }}">
            </div>

            <button type="submit"
                    class="btn"
                    style="background-color: var(--cor-primaria); color: white;">
                Salvar Validade
            </button>

            <a href="{% url 'editar_material' material.id %}"
               class="btn btn-outline-secondary">
                Voltar
            </a>
        </form>

    </div>
</div>

{% endblock %}
