{% extends 'estoque/base.html' %}

{% block title %}Excluir Material{% endblock %}

{% block content %}

<h1 class="mb-4">Excluir Material</h1>

<div class="card card-indicador">
    <div class="card-body">
        <p>Tem certeza que deseja excluir o material <strong>{{ material.nome }}</strong>?</p>
        <p class="text-muted">Essa ação não pode ser desfeita.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, excluir</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>

{% endblock %}
