{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Almoxarifado{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #0F766E;
            --cor-primaria-escura: #134E4A;
            --cor-destaque: #5EEAD4;
            --cor-fundo: #F8FAFC;
            --cor-texto: #1E293B;
            --cor-alerta: #F59E0B;
            --cor-erro: #DC2626;
        }
        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
        }
        .navbar {
            background-color: var(--cor-primaria-escura) !important;
        }
        .navbar-brand {
            color: white !important;
            font-weight: 600;
        }
        .card-indicador {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card-indicador .card-body {
            padding: 1.5rem;
        }
        .indicador-numero {
            font-size: 2.2rem;
            font-weight: 700;
        }
        .bg-teal {
            background-color: var(--cor-primaria) !important;
            color: white;
        }
        .bg-alerta-suave {
            background-color: #FEF3C7 !important;
            color: #92400E;
        }
        .bg-erro-suave {
            background-color: #FEE2E2 !important;
            color: #991B1B;
        }
        .table thead {
            background-color: var(--cor-primaria);
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">Almoxarifado</a>
        <div class="d-flex gap-2">
            <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="{% url 'listar_materiais' %}" class="btn btn-outline-light btn-sm">Materiais</a>
        </div>
    </div>
</nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
